version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grymster-torrserver_app_1
      APP_PORT: 8090
      PROXY_AUTH_ADD: "false"
  app:
    image: ghcr.io/yourok/torrserver:MatriX.142.1@sha256:e3fe5b867e86e37c3a17089880bc1d34fbf74951656f38b034e10e0837736490
    user: "1000:1000"
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
      TS_CONF_PATH: /opt/torrserver/config
      TS_TORR_DIR: /opt/torrserver/torrents
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/torrserver/config
      - ${APP_DATA_DIR}/data/torrents:/opt/torrserver/torrents

